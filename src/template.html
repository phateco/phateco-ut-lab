<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PHATECO UT Lab</title>
<link rel="icon" type="image/svg+xml" href="/*__FAVICON__*/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  /* Instrument-room palette: blue-steel panels, amber controls, phosphor trace. Layout: sidebar course map + lab grid (specimen | flaw detector | tasks). */
  --bg: #0d141b;
  --panel: #141e28;
  --panel2: #1a2632;
  --line: #273846;
  --ink: #e5edf3;
  --muted: #8ea3b4;
  --accent: #ffb347;
  --accent-ink: #1d1406;
  --cyan: #5cc8f0;
  --good: #5ee0a0;
  --warn: #ffd166;
  --bad: #ff5a5f;
  --f-body: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --r: 10px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body); -webkit-font-smoothing: antialiased; }
a { color: var(--cyan); }
h1, h2, h3, h4, h5 { margin: 0; text-wrap: balance; line-height: 1.25; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.topbar { position: sticky; top: 0; z-index: 30; height: 52px; display: flex; align-items: center; gap: 12px; padding: 0 16px; background: rgba(13,20,27,0.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: 0.01em; text-decoration: none; color: var(--ink); }
.brand .logo, .brand .logo svg { width: 32px; height: 32px; flex: none; display: block; }
.bn { color: var(--accent); font-weight: 700; }
.hero.about-hero { display: flex; justify-content: flex-start; gap: 20px; align-items: center; flex-wrap: wrap; }
.about-hero .logo svg { width: 96px; height: 96px; display: block; }
.vtag { display: inline-block; font: 600 12px var(--f-mono); padding: 3px 8px; border-radius: 6px; background: var(--panel2); border: 1px solid var(--line); color: var(--accent); }
.nav .navsep { height: 1px; background: var(--line); margin: 8px 6px; }
.brand small { color: var(--muted); font-weight: 500; }
#menuB { display: none; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
.shell { display: grid; grid-template-columns: 236px 1fr; min-height: calc(100% - 52px); }
.nav { position: sticky; top: 52px; align-self: start; height: calc(100vh - 52px); overflow: auto; padding: 14px 10px; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; color: var(--muted); text-decoration: none; font-size: 14px; }
.nav a:hover { background: var(--panel); color: var(--ink); }
.nav a.on { background: var(--panel2); color: var(--ink); box-shadow: inset 3px 0 0 var(--accent); }
.nn { width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; background: var(--panel2); border: 1px solid var(--line); font: 600 12px var(--f-mono); color: var(--accent); flex: none; }
main { padding: 18px 20px 60px; min-width: 0; }
@media (max-width: 900px) {
  #menuB { display: block; }
  .shell { grid-template-columns: 1fr; }
  .nav { position: fixed; left: 0; top: 52px; width: 270px; z-index: 40; background: var(--bg); transform: translateX(-100%); transition: transform .2s; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
  body.navopen .nav { transform: none; }
  main { padding: 14px 16px 60px; }
}
.eyebrow { margin: 0 0 4px; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
.lead { color: var(--muted); max-width: 68ch; margin: 8px 0 0; }
.lead.sm { font-size: 14px; }
.hero { display: grid; grid-template-columns: 1.2fr 1fr; gap: 28px; align-items: center; padding: 18px 0 26px; border-bottom: 1px solid var(--line); }
.hero h1 { font-size: clamp(28px, 4vw, 42px); letter-spacing: -0.01em; }
.hero .btnrow { margin-top: 18px; }
.heroc { width: 100%; height: auto; border-radius: 12px; border: 1px solid var(--line); }
@media (max-width: 800px) { .hero { grid-template-columns: 1fr; } }
.part { margin: 26px 0 10px; font-size: 15px; color: var(--muted); font-weight: 600; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.mcard { display: flex; flex-direction: column; gap: 6px; padding: 14px; border-radius: var(--r); background: var(--panel); border: 1px solid var(--line); text-decoration: none; color: var(--ink); transition: border-color .15s, transform .15s; }
.mcard:hover { border-color: var(--accent); transform: translateY(-1px); }
.mcard p { margin: 0; color: var(--muted); font-size: 13.5px; flex: 1; }
.mc-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.mc-n { font: 700 20px var(--f-mono); color: var(--accent); }
.mc-refs { font-size: 11px; color: var(--muted); text-align: right; }
.bar { height: 4px; border-radius: 4px; background: var(--panel2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--good); }
.mcard small { color: var(--muted); font-size: 12px; }
.notes { margin-top: 26px; }
.notes ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; color: var(--muted); }
.modhead { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; padding-bottom: 14px; margin-bottom: 14px; border-bottom: 1px solid var(--line); }
.modhead h2 { font-size: clamp(22px, 3vw, 28px); }
.modnav { display: flex; gap: 8px; flex-wrap: wrap; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; }
.card-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.card-h h3 { font-size: 15px; }
.info { padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.info h4 { font-size: 14px; color: var(--ink); }
.info h5 { font-size: 15px; color: var(--accent); margin-bottom: 4px; }
.info p { margin: 0; }
.info-b { color: var(--muted); font-size: 14px; display: flex; flex-direction: column; gap: 8px; }
.info-b b { color: var(--ink); }
.mini { font-size: 12.5px; color: var(--muted); margin: 0; }
.pad { padding: 10px 12px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.two { display: grid; grid-template-columns: 1.35fr 1fr; gap: 14px; }
.two.tight { gap: 10px; grid-template-columns: 1.5fr 1fr; }
@media (max-width: 1000px) { .two, .two.tight { grid-template-columns: 1fr; } }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 14px; border-radius: 8px; background: var(--panel2); border: 1px solid var(--line); color: var(--ink); text-decoration: none; cursor: pointer; font-size: 14px; font-weight: 500; }
.btn:hover { border-color: #3d5366; }
.btn.pri { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.danger { color: var(--bad); }
.btn.on { border-color: var(--accent); color: var(--accent); }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { padding: 4px 10px; border-radius: 999px; background: var(--panel2); border: 1px solid var(--line); font-size: 12.5px; cursor: pointer; color: var(--muted); }
.chip.on { color: var(--accent); border-color: var(--accent); }
.seg { display: inline-flex; background: var(--bg); border: 1px solid var(--line); border-radius: 9px; padding: 2px; flex-wrap: wrap; }
.seg-b { background: none; border: 0; padding: 5px 11px; border-radius: 7px; cursor: pointer; color: var(--muted); font-size: 13.5px; }
.seg-b.on { background: var(--panel2); color: var(--ink); box-shadow: inset 0 -2px 0 var(--accent); }
.sel { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; max-width: 100%; font-size: 13.5px; }
.sel-wrap { display: flex; gap: 8px; flex-wrap: wrap; min-width: 0; flex: 1; }
.sel-wrap .sel { flex: 1 1 220px; }
.rng { accent-color: var(--accent); width: 160px; }
.sliders { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; border-top: 1px solid var(--line); }
@media (max-width: 600px) { .sliders { grid-template-columns: 1fr; } }
.sliders .rl { justify-content: space-between; }
.rng.wide { flex: 1; width: auto; min-width: 90px; }
.sv { font: 600 13px var(--f-mono); color: var(--accent); min-width: 72px; text-align: right; }
.piezo-cv { height: 230px; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); }
.tbl.pz tr[data-i] { cursor: pointer; }
.tbl.pz tr.on td { color: var(--accent); }
.pznote b { color: var(--ink); }
.rl { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
/* lab */
.lab { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 14px; align-items: start; }
.lab-main { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 14px; min-width: 0; }
.lab.wide .lab-main { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); }
.lab-extra { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 14px; }
.lab-extra:empty { display: none; }
.lab-side { display: flex; flex-direction: column; gap: 12px; position: sticky; top: 64px; max-height: calc(100vh - 76px); overflow: auto; }
@media (max-width: 1400px) { .lab { grid-template-columns: 1fr; } .lab-side { position: static; max-height: none; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); align-items: start; } }
@media (max-width: 1100px) { .lab-main, .lab.wide .lab-main { grid-template-columns: 1fr; } }
.viewwrap { position: relative; }
.viewbox { height: 380px; position: relative; overflow: hidden; background: radial-gradient(120% 90% at 50% 0%, #1a2734 0%, #0c1218 100%); }
.lab.wide .viewbox { height: 470px; }
@media (max-width: 700px) { .viewbox, .lab.wide .viewbox { height: 260px; } .movebar { padding: 8px 10px; gap: 6px 10px; } .mv { min-width: 34px; height: 34px; } }
.sv2 { position: absolute; inset: 0; }
.cv { display: block; touch-action: none; }
.vtools { position: absolute; left: 8px; top: 8px; right: 8px; display: flex; gap: 6px; flex-wrap: wrap; pointer-events: none; }
.vtools > * { pointer-events: auto; background: rgba(20,30,40,0.85); }
.movebar { display: flex; gap: 10px 16px; flex-wrap: wrap; align-items: center; padding: 10px 12px; border-top: 1px solid var(--line); }
.mvgrp { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.mvlab { font-size: 12px; color: var(--muted); margin-right: 4px; }
.mv { min-width: 38px; height: 36px; border-radius: 8px; background: var(--panel2); border: 1px solid var(--line); cursor: pointer; font: 600 14px var(--f-mono); touch-action: manipulation; user-select: none; }
.mv:active { background: var(--line); }
.mv.wide { padding: 0 12px; font: 500 13px var(--f-body); }
.postxt { font: 12px var(--f-mono); color: var(--muted); margin-left: auto; }
.nc.skew { padding: 4px 8px; }
/* instrument */
.inst { display: flex; flex-direction: column; }
.ascan-wrap { border-bottom: 1px solid var(--line); }
.ascan-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; padding: 8px 10px 4px; font: 12px var(--f-mono); color: var(--muted); }
.ascan-head b { color: var(--ink); }
.ah-b { display: flex; gap: 4px; flex-wrap: wrap; }
.sat { color: var(--bad); font-weight: 600; }
.ascan { height: 260px; position: relative; }
@media (max-width: 700px) { .ascan { height: 190px; } }
.reads { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); border-bottom: 1px solid var(--line); }
.rd { padding: 7px 8px; display: flex; flex-direction: column; border-right: 1px solid var(--line); min-width: 0; }
.rd:last-child { border-right: 0; }
.rd span { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rd b { font: 600 14px var(--f-mono); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rd small { font-size: 10px; color: var(--muted); }
.reads.hot .rd b { color: var(--accent); }
@media (max-width: 600px) { .reads { grid-template-columns: repeat(3, minmax(0, 1fr)); } .rd:nth-child(3) { border-right: 0; } .rd:nth-child(-n+3) { border-bottom: 1px solid var(--line); } }
.itabs { display: flex; gap: 2px; padding: 6px 8px 0; border-bottom: 1px solid var(--line); overflow-x: auto; }
.itab { background: none; border: 0; padding: 8px 12px; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; font-size: 14px; }
.itab.on { color: var(--ink); border-color: var(--accent); }
.ipane { display: none; padding: 10px; }
.ipane.on { display: block; }
.grid-ctl { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; align-items: start; }
.nc { background: var(--bg); border: 1px solid var(--line); border-radius: 9px; padding: 6px 8px 8px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.nc.wide { grid-column: 1 / -1; }
.nc.big { border-color: #5a4628; }
.nc-lab { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; font-size: 12px; color: var(--muted); }
.nc-row { display: flex; align-items: stretch; gap: 4px; }
.nc-btn { width: 36px; height: 34px; border-radius: 7px; border: 1px solid var(--line); background: var(--panel2); cursor: pointer; font: 600 18px var(--f-mono); touch-action: manipulation; user-select: none; flex: none; }
.nc-btn:active { background: var(--line); }
.nc-val { flex: 1; min-width: 0; border: 0; background: none; font: 600 17px var(--f-mono); font-variant-numeric: tabular-nums; cursor: text; text-align: center; color: var(--ink); }
.nc.big .nc-val { color: var(--accent); font-size: 20px; }
.nc-input { flex: 1; min-width: 0; width: 60px; background: var(--panel2); border: 1px solid var(--accent); border-radius: 6px; text-align: center; font: 600 16px var(--f-mono); }
.nc-step { align-self: flex-start; background: none; border: 0; padding: 0; font-size: 11px; color: var(--cyan); cursor: pointer; }
.grid-ctl > .btnrow, .grid-ctl > p { grid-column: 1 / -1; }
.dacinfo { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 4px 12px; font: 12px var(--f-mono); color: var(--muted); }
.dacinfo em { font-family: var(--f-body); }
/* tasks */
.tasks { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); }
.tasks header { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.tasks h3 { font-size: 15px; }
.score { font: 600 12px var(--f-mono); color: var(--muted); white-space: nowrap; }
.score.full { color: var(--good); }
.score.big { font-size: 16px; color: var(--accent); }
.steps { list-style: none; margin: 0; padding: 6px; counter-reset: s; }
.step { padding: 8px 8px; border-radius: 8px; cursor: pointer; counter-increment: s; }
.step + .step { margin-top: 2px; }
.step.cur { background: var(--panel2); }
.st-head { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; }
.st-dot { flex: none; width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; font: 600 11px var(--f-mono); color: var(--muted); margin-top: 1px; }
.st-dot::before { content: counter(s); }
.step.ok .st-dot { background: var(--good); border-color: var(--good); color: #062a18; }
.step.ok .st-dot::before { content: "✓"; }
.step.warn .st-dot { border-color: var(--warn); color: var(--warn); }
.step.ok .st-t { color: var(--muted); }
.hint { display: none; margin: 6px 0 2px 32px; font-size: 13px; color: var(--muted); }
.hint b { color: var(--ink); }
.step.open .hint { display: block; }
.calchips { display: grid; gap: 6px; }
.cc { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font: 12px var(--f-mono); color: var(--muted); padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; }
.cc b { color: var(--ink); min-width: 70px; }
.cc.ok { border-color: rgba(94,224,160,0.5); }
.cc em { color: var(--good); font-style: normal; }
.calc { display: grid; gap: 4px; }
.kv { display: flex; justify-content: space-between; gap: 10px; font-size: 13.5px; color: var(--muted); border-bottom: 1px dashed var(--line); padding: 3px 0; }
.kv b { font: 600 14px var(--f-mono); color: var(--ink); font-variant-numeric: tabular-nums; }
.kv.hi b { color: var(--accent); }
.zone { margin: 6px 0 0; padding: 8px 10px; border-radius: 8px; background: var(--panel2); font-size: 13.5px; color: var(--ink); border-left: 3px solid var(--accent); }
.tbl-wrap { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.tbl th, .tbl td { padding: 5px 8px; border-bottom: 1px solid var(--line); text-align: left; font-variant-numeric: tabular-nums; }
.tbl th { color: var(--muted); font-weight: 500; font-size: 12px; }
.tbl.sm { font-size: 12.5px; }
.ti { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 3px 5px; font-size: 12.5px; }
.lnk { background: none; border: 0; color: var(--cyan); cursor: pointer; font-size: 12px; padding: 0; white-space: nowrap; }
.ok { color: var(--good); } .bad { color: var(--bad); } .warn { color: var(--warn); }
.grade .big { font: 700 28px var(--f-mono); }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
.flawlist { display: grid; gap: 6px; }
.flaw { display: flex; gap: 8px; align-items: center; text-align: left; padding: 7px 10px; border-radius: 8px; background: var(--panel2); border: 1px solid var(--line); cursor: pointer; font-size: 13.5px; }
.flaw i { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.flaw span { margin-left: auto; font: 12px var(--f-mono); color: var(--muted); }
.echodyn { height: 120px; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); }
.sig { margin: 0; padding-left: 16px; display: grid; gap: 6px; }
.view3d { position: relative; height: 440px; background: radial-gradient(120% 90% at 50% 0%, #1a2734 0%, #0c1218 100%); }
.view3d.tall { height: 500px; }
@media (max-width: 700px) { .view3d, .view3d.tall { height: 330px; } }
.view3d canvas { display: block; }
.no3d { padding: 30px; color: var(--muted); }
.partinfo { color: var(--muted); font-size: 14px; display: flex; flex-direction: column; gap: 8px; }
.partinfo p { margin: 0; }
.legend { margin: 0; padding-left: 18px; columns: 2; font-size: 13px; }
.chart { height: 150px; }
.cvbox { height: 360px; position: relative; background: #0f1820; border-radius: 8px; margin: 10px; overflow: hidden; }
@media (max-width: 700px) { .cvbox { height: 300px; } }
.svgill { width: 100%; height: auto; }
.quiz { display: grid; gap: 10px; margin-top: 12px; }
.q { padding: 12px 14px; }
.qq { margin: 0 0 8px; }
.qopts { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 6px; }
.qopt { text-align: left; padding: 8px 10px; border-radius: 8px; background: var(--panel2); border: 1px solid var(--line); cursor: pointer; font-size: 14px; }
.qopt:disabled { cursor: default; }
.qopt.right { border-color: var(--good); color: var(--good); }
.qopt.wrong { border-color: var(--bad); color: var(--bad); }
.expl { margin-top: 8px; }
.toast { position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 20px); opacity: 0; background: var(--panel2); border: 1px solid var(--line); padding: 10px 16px; border-radius: 10px; z-index: 100; transition: all .25s; max-width: min(92vw, 520px); box-shadow: 0 10px 30px rgba(0,0,0,.4); font-size: 14px; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast.good { border-color: var(--good); } .toast.bad { border-color: var(--bad); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header class="topbar">
  <button id="menuB" type="button" aria-label="Mở menu">☰</button>
  <a class="brand" href="#home">
    <span class="logo" aria-hidden="true">/*__LOGO__*/</span>
    <span><b class="bn">PHATECO</b> UT Lab <small>· Mô phỏng đào tạo siêu âm</small></span>
  </a>
</header>
<div class="shell">
  <nav class="nav" id="nav" aria-label="Danh mục bài học"></nav>
  <main id="main"></main>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/*__APP__*/
</script>
</body>
